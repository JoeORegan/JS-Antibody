<svg xmlns="http://www.w3.org/2000/svg" width="2722" height="724" viewBox="0 0 2722 724">
  <title>ANTIBODYJS Outline - Simplified Geometry</title>
  <desc>Clean vector outline of ANTIBODYJS with uniform stroke thickness on J and widened, consistent S geometry matching Antibody.</desc>
  <defs>
    <style>
      :root {
        --svg-accent: #AAAAAA;
        --gradient-start: #0000b4;
        --gradient-end: #01004e;
        --sweep-color: rgba(255, 255, 255, 0.4);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --svg-accent: #60a5fa;
          --gradient-start: #23d5ab;
          --gradient-end: #9a4eff;
          --sweep-color: rgba(255, 255, 255, 0.5);
        }
      }
      .line {
        fill: url(#vertical-gradient);
        fill-rule: evenodd;
        clip-rule: evenodd;
      }
      
      .sweep-line {
        fill: url(#sweep-gradient);
        fill-rule: evenodd;
        clip-rule: evenodd;
        mix-blend-mode: screen;
      }

      .stop-top { stop-color: var(--gradient-start); }
      .stop-bottom { stop-color: var(--gradient-end); }
    </style>
    
    <linearGradient id="vertical-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" class="stop-top" />
      <stop offset="100%" class="stop-bottom" />
    </linearGradient>

    <linearGradient id="sweep-gradient" y1="0%" y2="0%" gradientUnits="userSpaceOnUse" x1="-600" x2="600">
      <animate attributeName="x1" from="-600" to="2722" dur="3.75s" repeatCount="indefinite" />
      <animate attributeName="x2" from="600" to="3922" dur="3.75s" repeatCount="indefinite" />
      <stop offset="0%" stop-color="transparent" />
      <stop offset="40%" stop-color="transparent" />
      <stop offset="50%" stop-color="var(--sweep-color)" />
      <stop offset="60%" stop-color="transparent" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>

